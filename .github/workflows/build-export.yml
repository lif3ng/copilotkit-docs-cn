name: build-export

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: |
          cd showcase/scripts
          npm ci --no-audit --no-fund
          cd ../harness
          # 上游靠 pnpm workspace 提升 js-yaml；独立 npm 下需补装
          npm install js-yaml@^4.1.0 --no-save --ignore-scripts --no-audit --no-fund
          cd ../shell-docs
          npm ci --no-audit --no-fund

      # Windows 检出把悬空 symlink（public/angular、public/vue → 未构建的 dist）
      # 落成文本文件并提交为普通文件；Linux 检出恢复为悬空 symlink，删除以对齐
      # 本地构建时「路径不存在」的行为。
      - name: Neutralize dangling dist symlinks
        run: |
          find showcase/integrations -type l \( -name angular -o -name vue \) -print -delete

      - name: Export build (NEXT_STATIC_EXPORT=1)
        run: |
          cd showcase/shell-docs
          mv src/middleware.ts src/middleware.ts.disabled
          mv src/app/llms.txt/route.ts src/app/llms.txt/route.ts.disabled
          mv src/app/llms-full.txt/route.ts src/app/llms-full.txt/route.ts.disabled
          mv "src/app/llms-mdx/[[...slug]]/route.ts" "src/app/llms-mdx/[[...slug]]/route.ts.disabled"
          mv "src/app/og/[...slug]/route.tsx" "src/app/og/[...slug]/route.tsx.disabled"
          mv "src/app/frontends/[frontend]/[...slug]/page.tsx" "src/app/frontends/[frontend]/[...slug]/page.tsx.disabled"
          node ../scripts/patch-dynamic.cjs --apply
          NEXT_STATIC_EXPORT=1 \
          NEXT_PUBLIC_BASE_URL="https://lif3ng.github.io/copilotkit-docs-cn" \
          npm run build
          echo "--- out/ ---"
          du -sh out
          find out -name "*.html" | wc -l

      # 断链审计：全部 HTML 引用的站内资源（src/href 根路径）必须存在于 out/。
      # 外链（http）、锚点、href="#"/mailto 跳过。发现缺失即失败，防止
      # basePath 漏改的静态资源悄悄上线。
      - name: Broken-asset audit
        run: |
          cd showcase/shell-docs
          node -e '
          const fs = require("fs"), path = require("path");
          const BASE = process.env.NEXT_PUBLIC_BASE_PATH || "/copilotkit-docs-cn";
          const out = path.resolve("out");
          // 只审静态资源（_next/images/logos/videos 等文件形态）；页面链接的
          // 存在性由 generateStaticParams 的 sitemap 枚举保证，不在此重复。
          const ASSET = new RegExp(`^${BASE}/(_next|images|logos|videos|fonts|img)/`);
          const htmls = [];
          (function walk(d) {
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p);
              else if (p.endsWith(".html")) htmls.push(p);
            }
          })(out);
          const refs = new Set();
          for (const f of htmls) {
            const html = fs.readFileSync(f, "utf8");
            for (const m of html.matchAll(/(?:src|href|poster)="(\/[^"#?]*)/g)) {
              if (ASSET.test(m[1])) refs.add(m[1]);
            }
          }
          let missing = 0;
          for (const ref of [...refs].sort()) {
            const target = path.join(out, decodeURIComponent(ref.slice(BASE.length).split("?")[0]));
            if (fs.existsSync(target)) continue;
            missing++;
            if (missing <= 30) console.log("MISSING", ref);
          }
          console.log(`静态资源引用 ${refs.size} 个，缺失 ${missing}`);
          if (missing > 0) process.exit(1);
          '

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/shell-docs/out/

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
